name: Aion Docker Image v5.7.0-community

on:
  push:
    branches: [ "temporal" ]
  pull_request:
    branches: [ "temporal" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout default branch
      uses: actions/checkout@v4
    
    - name: Set env variable
      run: |
        echo "BUILD_TIME=$(date +'%Y%m%d')" >> $GITHUB_ENV
        echo "COMMIT_SHA_SHORT=$(git rev-parse --short ${{ github.sha }})" >> $GITHUB_ENV
        echo ${{env.BUILD_TIME}}
        echo ${{env.COMMIT_SHA_SHORT}}
    
    - name: Login to hub.docker.com
      uses: docker/login-action@v3
      with:
        username: songjinghe
        password: ${{ secrets.dockerhub }}
    
    - name: Build and Push Docker Image (aion-5.7.0-community)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: |
          songjinghe/temporal-graph-dbms:aion-5.7.0-${{env.COMMIT_SHA_SHORT}}
          songjinghe/temporal-graph-dbms:aion-5.7.0-latest
